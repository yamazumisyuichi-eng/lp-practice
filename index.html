<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美容クリニック | LP練習</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">LUMINA CLINIC</div>
    <a href="#contact" class="header-btn">無料カウンセリング</a>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <p class="hero-label">BEAUTY & WELLNESS</p>
        <h1>自分らしい美しさを、<br>もっと自由に。</h1>
        <p class="hero-description">
          あなたの理想に寄り添う<br>
          美容クリニック。
        </p>
        <a href="#contact" class="hero-btn">
          無料カウンセリングを予約
        </a>
      </div>
      <div class="hero-image">
        <img
  src="https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=900"
  alt="美容クリニックのイメージ"
  class="clinic-image"
>
      </div>
    </section>

    <section id="contact" class="contact">
      <h2>無料カウンセリング</h2>
      <p>まずはお気軽にご相談ください。</p>
      <p>※このページは制作練習用の架空サイトです。</p>
    </section>
    <section class="faq" id="faq">
  <h2>よくあるご質問</h2>

  <details class="faq-item">
    <summary>カウンセリングは無料ですか？</summary>
    <p>はい、初回カウンセリングは無料です。</p>
  </details>

  <details class="faq-item">
    <summary>予約は必要ですか？</summary>
    <p>事前のご予約をお願いしております。</p>
  </details>

  <details class="faq-item">
    <summary>施術時間はどれくらいですか？</summary>
    <p>施術内容によって異なります。</p>
  </details>
</section>
  </main>
  <script src="script.js"></script>
</body>
</html>
